name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KAUFI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # With the release key in place, test APKs install as updates over each
      # other. Without it, every run signs with a new random debug key.
      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KAUFI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kaufi.jks"
          echo "KAUFI_KEYSTORE=$RUNNER_TEMP/kaufi.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KAUFI_KEYSTORE_PASSWORD: ${{ secrets.KAUFI_KEYSTORE_PASSWORD }}
          KAUFI_KEY_ALIAS: ${{ secrets.KAUFI_KEY_ALIAS }}
          KAUFI_KEY_PASSWORD: ${{ secrets.KAUFI_KEY_PASSWORD }}
        # Minutes since 1970 as version code: always newer than any earlier
        # test or release APK, so each one installs as an update.
        run: flutter build apk --release --build-number="$(( $(date +%s) / 60 ))"

      - uses: actions/upload-artifact@v4
        with:
          name: kaufi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
