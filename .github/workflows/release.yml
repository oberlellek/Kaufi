name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub
# release. Obtainium can follow these releases for updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KAUFI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Restore signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KAUFI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kaufi.jks"
          echo "KAUFI_KEYSTORE=$RUNNER_TEMP/kaufi.jks" >> "$GITHUB_ENV"

      - name: Warn about missing signing key
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::No KAUFI_KEYSTORE_BASE64 secret, the APK is signed with a throwaway debug key and cannot update other builds."

      - name: Build APK
        env:
          KAUFI_KEYSTORE_PASSWORD: ${{ secrets.KAUFI_KEYSTORE_PASSWORD }}
          KAUFI_KEY_ALIAS: ${{ secrets.KAUFI_KEY_ALIAS }}
          KAUFI_KEY_PASSWORD: ${{ secrets.KAUFI_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$version" --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "kaufi-$version.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: kaufi-*.apk
          generate_release_notes: true
